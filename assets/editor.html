<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Redacter</title>
    <link rel="stylesheet" href="./editor.css" />
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
    <script src="./editor.js" defer></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">▧</span>
        <div>
          <h1>Image Redacter</h1>
          <p id="filename">Loading image…</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="privacy"><span></span> Stays on this computer</span>
        <button id="copyButton" class="button secondary">Copy PNG</button>
        <button id="saveButton" class="button primary">Save PNG</button>
      </div>
    </header>

    <main>
      <aside aria-label="Redaction controls">
        <section>
          <h2>Selection</h2>
          <div class="tool-grid" role="radiogroup" aria-label="Selection tool">
            <button class="tool active" data-tool="rectangle" role="radio" aria-checked="true"><b>▭</b>Rectangle</button>
            <button class="tool" data-tool="circle" role="radio" aria-checked="false"><b>◯</b>Circle</button>
            <button class="tool" data-tool="freeform" role="radio" aria-checked="false"><b>⬠</b>Freeform</button>
            <button class="tool" data-tool="paint" role="radio" aria-checked="false"><b>✎</b>Paint</button>
            <button class="tool wide" data-tool="text" role="radio" aria-checked="false"><b>T</b>Select detected text</button>
          </div>
          <button id="detectTextButton" class="button secondary full">Detect Text</button>
          <div id="ocrProgress" class="progress" hidden>
            <div><span id="ocrProgressBar"></span></div>
            <p id="ocrStatus">Preparing text detection…</p>
          </div>
        </section>

        <section>
          <h2>Redaction</h2>
          <label for="effect">Effect</label>
          <select id="effect">
            <option value="mosaic" selected>Mosaic</option>
            <option value="blur">Blur</option>
            <option value="solid">Solid color</option>
          </select>
          <div id="mosaicOptions" class="option-row">
            <label for="mosaicSize">Block size <output id="mosaicValue">14 px</output></label>
            <input id="mosaicSize" type="range" min="4" max="48" value="14" />
          </div>
          <div id="blurOptions" class="option-row" hidden>
            <label for="blurSize">Blur strength <output id="blurValue">18 px</output></label>
            <input id="blurSize" type="range" min="4" max="40" value="18" />
          </div>
          <div id="solidOptions" class="option-row" hidden>
            <label for="solidColor">Color</label>
            <input id="solidColor" type="color" value="#111827" />
          </div>
          <div id="paintOptions" class="option-row" hidden>
            <label for="brushSize">Brush size <output id="brushValue">36 px</output></label>
            <input id="brushSize" type="range" min="8" max="160" value="36" />
          </div>
        </section>

        <section>
          <h2>Presentation frame</h2>
          <label for="frameStyle">Background</label>
          <select id="frameStyle">
            <option value="violet">Violet dusk</option>
            <option value="sunset">Sunset</option>
            <option value="ocean">Ocean</option>
            <option value="graphite">Graphite</option>
            <option value="paper">Paper</option>
          </select>
          <label class="check"><input id="frameShadow" type="checkbox" checked /> Add window shadow</label>
          <button id="frameButton" class="button secondary full">Save Framed PNG</button>
          <p class="hint">Built in because ray.so does not accept arbitrary image uploads.</p>
        </section>
        <div id="scrollHint" class="scroll-hint">More options ↓</div>
      </aside>

      <section class="workspace" aria-label="Image canvas">
        <div class="canvas-toolbar">
          <div class="history">
            <button id="undoButton" disabled title="Undo (⌘/Ctrl Z)">↶ <span>Undo</span></button>
            <button id="redoButton" disabled title="Redo (⌘/Ctrl Shift Z)">↷ <span>Redo</span></button>
            <button id="clearButton" disabled>Clear all</button>
          </div>
          <div class="zoom">
            <button id="zoomOut" aria-label="Zoom out">−</button>
            <output id="zoomValue">100%</output>
            <button id="zoomIn" aria-label="Zoom in">+</button>
            <button id="fitButton">Fit</button>
          </div>
        </div>
        <div id="canvasViewport" class="canvas-viewport">
          <div id="loading" class="loading"><span></span>Loading original…</div>
          <div id="canvasStack" class="canvas-stack" hidden>
            <canvas id="imageCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
          </div>
        </div>
        <footer>
          <span id="dimensions"></span>
          <span id="maskCount">0 redactions</span>
          <span>Original is read-only</span>
        </footer>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
